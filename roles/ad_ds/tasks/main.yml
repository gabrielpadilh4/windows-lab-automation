---
- name: Set the computer name before promotion
  ansible.windows.win_hostname:
    name: "{{ ad_hostname }}"
  register: ad_rename

- name: Reboot to apply the new computer name
  ansible.windows.win_reboot:
  when: ad_rename.reboot_required

- name: Ensure AD-Domain-Services feature is installed
  ansible.windows.win_feature:
    name: AD-Domain-Services
    include_management_tools: true
    state: present
  register: addc_feature

- name: Reboot if the feature install requires it
  ansible.windows.win_reboot:
  when: addc_feature.reboot_required

- name: Promote server to the first domain controller of a new forest
  microsoft.ad.domain:
    dns_domain_name: "{{ ad_domain_dns_name }}"
    domain_netbios_name: "{{ ad_domain_netbios_name }}"
    forest_mode: "{{ ad_forest_mode }}"
    domain_mode: "{{ ad_domain_mode }}"
    safe_mode_password: "{{ ad_safe_mode_password }}"
    install_dns: true
    reboot: true
  register: ad_promotion

- name: Wait for Active Directory Web Services to be ready
  ansible.windows.win_service_info:
    name: ADWS
  register: adws
  until: adws.services | selectattr('state', 'equalto', 'started') | list | length > 0
  retries: 30
  delay: 15
